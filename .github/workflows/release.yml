name: Release CLI

# Push a tag like v0.2.0 (and cli/v0.2.0 for `go install`) to publish binaries.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: false
      - name: Test
        working-directory: cli
        run: go vet ./... && go test ./...
      - name: Cross-compile
        working-directory: cli
        run: |
          mkdir -p ../dist-cli
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
              -o ../dist-cli/wardenbroker-$os-$arch$ext ./cmd/wardenbroker
          done
          cd ../dist-cli && sha256sum wardenbroker-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist-cli/* --title "$GITHUB_REF_NAME" --generate-notes
